name: "NVIDIA Portfolio Optimization"
description: >-
  GPU-accelerated portfolio optimization powered by NVIDIA cuOpt.
  Supports Mean-CVaR and Mean-Variance (Markowitz) optimization with
  backtesting and dynamic rebalancing. Includes Jupyter notebooks and
  an interactive Streamlit demo.
author: "Cloudera"
specification_version: 1.0
prototype_version: 1.0
date: "2026-09-01"

environment_variables:
  PORTFOLIO_OPT_DATASET:
    default: "dow30"
    description: >-
      Stock universe to download on setup. Options: "dow30" (32 stocks,
      fast), "sp100" (103 stocks), "sp500" (~390 stocks, slower download).
      Data is fetched from Yahoo Finance via yfinance.
    required: false

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Nvidia GPU

tasks:
  - type: run_session
    name: Install Dependencies
    script: scripts/install_dependencies.py
    short_summary: Install core Python packages (numpy, cvxpy, etc.)
    kernel: python3
    cpu: 2
    memory: 8

  - type: run_session
    name: Install GPU Packages
    script: scripts/install_gpu_packages.py
    short_summary: Install NVIDIA cuOpt and cuML from NVIDIA PyPI
    kernel: python3
    cpu: 2
    memory: 16

  - type: run_session
    name: Download Stock Data
    script: scripts/download_data.py
    short_summary: Download historical stock prices via yfinance
    kernel: python3
    cpu: 2
    memory: 4

  - type: create_job
    name: Train and Register Forecast Models
    entity_label: train_register
    script: scripts/train_and_register.py
    short_summary: Create an optional job that trains the forecast models and registers them in the AI Registry
    long_summary: >-
      Creates, but does not run, a job that trains a LightGBM model for
      expected returns and GARCH for volatility, logs them to MLflow and
      registers them in the AI Registry. Run it before Deploy Forecast Model.
      The demo application trains its own copies and does not need it.
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 60

  - type: create_job
    name: Validate GPU Pipeline
    entity_label: validate_gpu
    script: scripts/validate_gpu.py
    short_summary: Create a job that checks the GPU pipeline (run it before starting work)
    long_summary: >-
      Creates, but does not run, a job that generates scenarios on the GPU
      with cuML and solves a small portfolio with cuOpt. Run it from the
      Jobs page before starting work, or after changing the runtime or GPU.
    kernel: python3
    cpu: 2
    memory: 8
    gpu: 1

  - type: create_job
    name: Deploy Forecast Model
    entity_label: deploy_model
    script: scripts/deploy_model.py
    short_summary: Create an optional job that deploys the returns forecaster as a model endpoint
    long_summary: >-
      Creates, but does not run, a job that deploys the registered LightGBM
      model from the AI Registry to a Cloudera AI model endpoint. The demo
      application does not need it; run it only to serve the forecast as an
      endpoint. Reads registration info written by train_and_register.py.
    kernel: python3
    cpu: 2
    memory: 4
    timeout: 30

  - type: start_application
    name: Portfolio Rebalancing Demo
    subdomain: portfolio-opt
    script: scripts/launch_streamlit.py
    short_summary: Start the interactive Streamlit rebalancing demo
    long_summary: >-
      Launches the GPU vs CPU rebalancing comparison app. Requires a GPU
      session. The app downloads data on first run if not already present.
    kernel: python3
    cpu: 2
    memory: 16
    gpu: 1
