<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif">
  <title>Portfolio optimization blueprint architecture on Cloudera AI</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a5563; stroke-width: 1.5; rx: 8; }
      .gpu { fill: #f1f8e9; stroke: #76b900; stroke-width: 1.5; rx: 8; }
      .cld { fill: #eef4fb; stroke: #1f5aa6; stroke-width: 1.5; rx: 8; }
      .t { font-size: 14px; fill: #1b1f24; font-weight: 700; text-anchor: middle; }
      .s { font-size: 12px; fill: #3d4550; text-anchor: middle; }
      .h { font-size: 15px; font-weight: 700; fill: #1b1f24; }
      .line { stroke: #4a5563; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4a5563; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>

  <!-- Cloudera AI Workbench frame -->
  <rect x="20" y="20" width="1060" height="600" fill="none" stroke="#1f5aa6" stroke-width="2" rx="12"/>
  <text x="40" y="48" class="h">Cloudera AI Workbench project (deployed as an AMP)</text>

  <!-- Row 1: training and serving -->
  <text x="40" y="84" class="h" style="font-size:13px;fill:#1f5aa6">1. Train, register and serve the forecasting models</text>
  <rect x="40" y="96" width="190" height="78" class="box"/>
  <text x="135" y="126" class="t">Market data</text>
  <text x="135" y="146" class="s">Yahoo Finance daily prices</text>
  <text x="135" y="162" class="s">(Download Stock Data task)</text>

  <rect x="290" y="96" width="220" height="78" class="cld"/>
  <text x="400" y="126" class="t">Train Forecasting Models</text>
  <text x="400" y="146" class="s">LightGBM: expected returns</text>
  <text x="400" y="162" class="s">GARCH: volatility per stock</text>

  <rect x="570" y="96" width="220" height="78" class="cld"/>
  <text x="680" y="126" class="t">MLflow + AI Registry</text>
  <text x="680" y="146" class="s">experiment run, registered</text>
  <text x="680" y="162" class="s">model version</text>

  <rect x="850" y="96" width="210" height="78" class="cld"/>
  <text x="955" y="126" class="t">Model endpoint</text>
  <text x="955" y="146" class="s">returns forecaster served</text>
  <text x="955" y="162" class="s">(Deploy Model task)</text>

  <path d="M230,135 L286,135" class="line"/>
  <path d="M510,135 L566,135" class="line"/>
  <path d="M790,135 L846,135" class="line"/>

  <!-- Row 2: GPU optimization pipeline -->
  <rect x="40" y="214" width="1020" height="236" class="gpu"/>
  <text x="60" y="240" class="h" style="font-size:13px;fill:#3f6b00">2. Optimize on an NVIDIA GPU session (cuML + cuOpt)</text>

  <rect x="60" y="262" width="170" height="92" class="box"/>
  <text x="145" y="292" class="t">Forecasts</text>
  <text x="145" y="312" class="s">returns from endpoint</text>
  <text x="145" y="328" class="s">volatility from GARCH</text>

  <rect x="262" y="262" width="186" height="92" class="box"/>
  <text x="355" y="292" class="t">Scenario generation</text>
  <text x="355" y="312" class="s">cuML whitened KDE on</text>
  <text x="355" y="328" class="s">history: 10,000 scenarios</text>

  <rect x="480" y="262" width="176" height="92" class="box"/>
  <text x="568" y="292" class="t">Rescale scenarios</text>
  <text x="568" y="312" class="s">to forecast return and</text>
  <text x="568" y="328" class="s">GARCH volatility</text>

  <rect x="688" y="262" width="176" height="92" class="box"/>
  <text x="776" y="292" class="t">Mean-CVaR solve</text>
  <text x="776" y="312" class="s">NVIDIA cuOpt (GPU)</text>
  <text x="776" y="328" class="s">λ·CVaR − expected return</text>

  <rect x="896" y="262" width="148" height="92" class="box"/>
  <text x="970" y="292" class="t">Portfolio</text>
  <text x="970" y="312" class="s">weights per stock</text>
  <text x="970" y="328" class="s">and cash</text>

  <path d="M230,308 L258,308" class="line"/>
  <path d="M448,308 L476,308" class="line"/>
  <path d="M656,308 L684,308" class="line"/>
  <path d="M864,308 L892,308" class="line"/>
  <!-- forecasts also feed the rescaling step -->
  <path d="M145,354 L145,392 L568,392 L568,358" class="dash"/>
  <text x="356" y="410" class="s">forecast return and volatility</text>

  <!-- endpoint to forecasts -->
  <path d="M955,174 L955,196 L145,196 L145,258" class="line"/>

  <!-- Row 3: consumers -->
  <text x="40" y="484" class="h" style="font-size:13px;fill:#1f5aa6">3. Use the portfolio</text>
  <rect x="40" y="496" width="320" height="96" class="cld"/>
  <text x="200" y="528" class="t">Streamlit rebalancing app</text>
  <text x="200" y="548" class="s">Cloudera AI Application (GPU):</text>
  <text x="200" y="564" class="s">rolling rebalancing on historical</text>
  <text x="200" y="580" class="s">scenarios; GPU vs CPU timing</text>

  <rect x="390" y="496" width="320" height="96" class="box"/>
  <text x="550" y="528" class="t">Backtesting</text>
  <text x="550" y="548" class="s">Sharpe, Sortino, max drawdown</text>
  <text x="550" y="564" class="s">against benchmark portfolios</text>

  <rect x="740" y="496" width="320" height="96" class="box"/>
  <text x="900" y="528" class="t">Notebooks and forecast script</text>
  <text x="900" y="548" class="s">worked examples and the end-to-end</text>
  <text x="900" y="564" class="s">run_forecast_optimization.py</text>

  <path d="M970,354 L970,470 L200,470 L200,492" class="line"/>
  <path d="M550,470 L550,492" class="line"/>
  <path d="M900,470 L900,492" class="line"/>
</svg>
